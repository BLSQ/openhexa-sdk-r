name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  graphql:
    name: Validate GraphQL operations
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: 3.14

      - name: Install dependencies
        run: pip install graphql-core requests

      - name: Validate operations against production
        run: python tools/validate_queries.py

  check:
    name: R CMD check (R ${{ matrix.r-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        r-version: ["4.2", "oldrel-1", "release"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up R ${{ matrix.r-version }}
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r-version }}
          use-public-rspm: true

      - name: Set up pandoc
        uses: r-lib/actions/setup-pandoc@v2

      - name: Install dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - name: Run R CMD check
        uses: r-lib/actions/check-r-package@v2
        with:
          args: 'c("--no-manual", "--as-cran")'
          error-on: '"warning"'
