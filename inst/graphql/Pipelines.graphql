query Pipelines($workspaceSlug: String!, $name: String, $page: Int, $perPage: Int) {
  pipelines(workspaceSlug: $workspaceSlug, name: $name, page: $page, perPage: $perPage) {
    totalPages
    items {
      id
      code
      name
      description
      type
      schedule
      createdAt
      updatedAt
      currentVersion {
        id
        versionNumber
        versionName
      }
      lastRuns: runs(orderBy: EXECUTION_DATE_DESC, page: 1, perPage: 1) {
        items {
          id
          status
          executionDate
        }
      }
    }
  }
}
