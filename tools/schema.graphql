type Database {
  tables(page: Int, perPage: Int, withColumns: Boolean = false, withCounts: Boolean = true): DatabaseTablePage!
  table(name: String!): DatabaseTable
  credentials: DatabaseCredentials
  readOnlyCredentials: DatabaseCredentials

  """
  Runs a read-only SQL query against the workspace database and returns the result.
  `maxRows` caps the number of returned rows; it defaults to 50 when omitted and is
  itself capped to a server-side hard limit. `origin` identifies where the query comes
  from for auditing purposes; it defaults to OTHER.
  """
  executeSQL(query: String!, maxRows: Int, origin: ExecuteSQLOrigin): ExecuteSQLResult!
}

type DatabaseCredentials {
  dbName: String!
  username: String!
  password: String!
  host: String!
  port: Int!
  url: String!
}

